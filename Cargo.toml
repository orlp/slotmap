[package]
name = "slotmap"
version = "1.1.1"  # Remember to grep and update version everywhere.
edition = "2018"
authors = ["Orson Peters <orsonpeters@gmail.com>"]
description = "Slotmap data structure"
license = "Zlib"
repository = "https://github.com/orlp/slotmap"
readme = "README.md"
keywords = ["slotmap", "storage", "allocator", "arena", "reference"]
categories = ["data-structures", "memory-management", "caching"]
rust-version = "1.80.0"

[features]
default = ["std"]
std = []

# not currently used, kept for compatibility only.
unstable = []

# activate `feature(doc_cfg)` within the crate during docs generation (nightly only)
doc_cfg = []

[dependencies]
serde = { version = "1.0", optional = true, default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
fxhash = "0.2.1"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
quickcheck = "1.0"

[package.metadata.docs.rs]
features = ["doc_cfg"]
